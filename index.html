<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#b8860b"><title>Inventario con códigos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#faf8f3;--card:#fff;--tx:#1d1b16;--mu:#6f6a5d;--bd:#e4dfd0;--ac:#b8860b;--acx:#fff;--bad:#b3261e;--ok:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150f;--card:#221f17;--tx:#f2eee2;--mu:#a49d8a;--bd:#3a3628;--ac:#d4a63a;--acx:#17150f;--bad:#f2867e;--ok:#7fcf84}}
:root[data-theme="dark"]{--bg:#17150f;--card:#221f17;--tx:#f2eee2;--mu:#a49d8a;--bd:#3a3628;--ac:#d4a63a;--acx:#17150f;--bad:#f2867e;--ok:#7fcf84}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:760px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;min-width:0}
input{flex:1 1 110px}button{cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
button.s{padding:4px 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 10px;background:var(--bg);cursor:pointer;font-size:13px}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip b{margin-left:6px;color:var(--mu);font-weight:400}.chip.on b{color:var(--acx)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat span{display:block;color:var(--mu);font-size:12px}.stat strong{font-size:18px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.item:first-child{border-top:0}
.nm{flex:1 1 160px}.nm small{display:block;color:var(--mu)}
.qty{display:flex;align-items:center;gap:6px}.qty strong{min-width:28px;text-align:center}
.low{color:var(--bad)}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);max-width:340px;width:92%;text-align:center}
dialog::backdrop{background:rgba(0,0,0,.5)}
#qr,#bc{display:flex;justify-content:center;margin:10px 0;background:#fff;padding:10px;border-radius:8px}
#bc svg{max-width:100%}
.mu{color:var(--mu);font-size:13px}
@media print{body>*:not(dialog){display:none}dialog{border:0;box-shadow:none}.noprint{display:none}}
</style>
</head>
<body>
<h1>Inventario y códigos</h1>

<div class="card"><h2>Conexión con Google Sheets</h2><div class="row"><input id="cu" placeholder="URL de la aplicación web (script)"><input id="ck" type="password" placeholder="Clave secreta"></div><div class="row" style="margin-top:8px"><button id="cfgSave" class="p">Guardar y sincronizar</button><button id="syncNow">Sincronizar ahora</button></div><div class="row" style="margin-top:8px"><button id="impBtn">Importar fotos de Drive</button><span class="mu" id="impMsg"></span></div></div>
<div class="stats">
  <div class="stat"><span>Referencias</span><strong id="sRef">0</strong></div>
  <div class="stat"><span>Unidades</span><strong id="sUni">0</strong></div>
  <div class="stat"><span>Valor (costo)</span><strong id="sVal">$0</strong></div>
</div>

<div class="card">
  <h2>Escanear o buscar código</h2>
  <div class="row"><input id="scan" placeholder="Escanea o escribe el código y presiona Enter" autocomplete="off">
  <button id="scanMinus">Salida −1</button><button id="scanPlus" class="p">Entrada +1</button></div>
  <div id="scanMsg" class="mu" style="margin-top:6px"></div>
</div>

<div class="card">
  <h2>Categorías</h2>
  <div class="row"><input id="newCat" placeholder="Nueva categoría (ej. Cadenas, Dijes…)"><button id="addCat">Agregar</button></div>
  <div class="chips" id="chips"></div>
  <div class="mu" style="margin-top:6px">Toca una categoría para filtrar. Mantén presionada (o clic derecho) para eliminarla.</div>
</div>

<div class="card">
  <h2>Nuevo producto</h2>
  <div class="row">
    <input id="fName" placeholder="Nombre / descripción" style="flex-basis:200px">
    <select id="fCat"></select>
  </div>
  <div class="row" style="margin-top:8px">
    <input id="fQty" type="number" min="0" placeholder="Cantidad">
    <input id="fCost" type="number" min="0" placeholder="Costo">
    <input id="fPrice" type="number" min="0" placeholder="Precio venta">
    <input id="fMin" type="number" min="0" placeholder="Stock mínimo">
  </div>
  <div class="row" style="margin-top:8px"><input id="fPhoto" placeholder="Foto de Drive: pega el enlace o el ID (opcional)"></div>
  <div class="row" style="margin-top:8px"><input id="fCode" placeholder="Código (vacío = automático)"><button id="add" class="p">Guardar producto</button></div>
</div>

<div class="card"><h2>Catálogo PDF</h2><div class="row"><input id="cTit" placeholder="Título de portada (opcional)" value="Catálogo"><select id="cPer"><option value="4">4 por hoja</option><option value="6" selected>6 por hoja</option><option value="9">9 por hoja</option></select></div><div class="row" style="margin-top:8px"><label class="mu"><input id="cOut" type="checkbox" style="flex:none"> Incluir agotados</label><button id="cGen" class="p">Generar catálogo</button></div><div class="mu" id="cMsg" style="margin-top:6px"></div></div>
<div class="card">
  <div class="row"><input id="q" placeholder="Buscar por nombre o código"></div>
  <div id="list" style="margin-top:6px"></div>
</div>
<div class="mu" id="saveMsg"></div>

<dialog id="dlg">
  <h2 id="dName"></h2>
  <div class="mu" id="dCode"></div>
  <div class="row" style="justify-content:center;margin-top:8px">
    <button id="tQr" class="p s">QR</button><button id="tBc" class="s">Código de barras</button>
  </div>
  <div id="qr"></div>
  <div id="bc" hidden><svg id="bcSvg"></svg></div>
  <div class="row noprint" style="justify-content:center">
    <button id="prn">Imprimir</button><button id="cls">Cerrar</button>
  </div>
</dialog>
<dialog id="pdlg"><h2 id="pName"></h2><div class="mu" id="pMsg"></div><img id="pImg" alt="" style="max-width:100%;border-radius:8px"><div class="row" style="justify-content:center;margin-top:8px"><button id="pCls">Cerrar</button></div></dialog>

<script>
var S={cats:["Cadenas","Aretes","Anillos","Dijes","Pulseras"],items:[],seq:1},filter="",KEY="inv_v1",dbDoc=null,timer=null;
var $=function(i){return document.getElementById(i)};
var money=function(n){return "$"+Math.round(n).toLocaleString("es-CO")};
var esc=function(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML};

var Q=[],CFG={u:"",k:""},busy=false;
function persist(){try{localStorage.setItem(KEY,JSON.stringify({S:S,Q:Q,CFG:CFG}))}catch(e){}}
function save(){persist();status()}
function status(m){if(m)window._m=m;$("saveMsg").textContent=(window._m||"")+(Q.length?" · Pendientes: "+Q.length:" · Sin pendientes")}
function op(o){o.id=Date.now()+"-"+Math.random().toString(36).slice(2,7);Q.push(o);save();clearTimeout(timer);timer=setTimeout(sync,800)}
function load(raw){try{var o=JSON.parse(raw);if(o.S)S=o.S;if(o.Q)Q=o.Q;if(o.CFG)CFG=o.CFG}catch(e){}}
async function sync(){
  if(busy||!CFG.u||!CFG.k||!navigator.onLine)return;busy=true;
  try{
    if(Q.length){var sent=Q.slice();var r=await fetch(CFG.u,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({k:CFG.k,ops:sent})});var j=await r.json();if(j.error)throw new Error(j.error);Q=Q.slice(sent.length)}
    var g=await fetch(CFG.u+"?k="+encodeURIComponent(CFG.k));var d=await g.json();if(d.error)throw new Error(d.error);
    if(!Q.length){if(d.cats.length)S.cats=d.cats;S.items=d.items.map(function(i){i.id=i.code;return i});var m=0;d.items.forEach(function(i){var n=parseInt(i.code.replace(/\D/g,""));if(n>m)m=n});S.seq=Math.max(S.seq,m+1)}
    persist();render();status("Sincronizado "+new Date().toLocaleTimeString("es-CO"));
  }catch(e){status("Sin sincronizar ("+e.message+")")}
  busy=false;
}
function render(){
  var q=$("q").value.toLowerCase(),h="",units=0,val=0;
  S.items.forEach(function(i){units+=i.qty;val+=i.qty*i.cost});
  $("sRef").textContent=S.items.length;$("sUni").textContent=units;$("sVal").textContent=money(val);
  var chips='<span class="chip'+(filter===""?" on":"")+'" data-c="">Todas<b>'+S.items.length+'</b></span>';
  S.cats.forEach(function(c){var n=S.items.filter(function(i){return i.cat===c}).length;
    chips+='<span class="chip'+(filter===c?" on":"")+'" data-c="'+esc(c)+'">'+esc(c)+'<b>'+n+'</b></span>'});
  $("chips").innerHTML=chips;
  var cur=$("fCat").value;
  $("fCat").innerHTML=S.cats.map(function(c){return "<option>"+esc(c)+"</option>"}).join("");
  if(S.cats.indexOf(cur)>-1)$("fCat").value=cur;
  var list=S.items.filter(function(i){return (!filter||i.cat===filter)&&(!q||i.name.toLowerCase().indexOf(q)>-1||i.code.toLowerCase().indexOf(q)>-1)});
  list.forEach(function(i){
    h+='<div class="item"><div class="nm"><b>'+esc(i.name)+'</b><small>'+esc(i.code)+' · '+esc(i.cat)+' · '+money(i.price)+'</small></div>'+
    '<div class="qty"><button class="s" data-a="m" data-id="'+i.id+'">−</button><strong class="'+(i.qty<=i.min?"low":"")+'">'+i.qty+'</strong><button class="s" data-a="p" data-id="'+i.id+'">+</button></div>'+
    '<div class="row">'+(i.photo?'<button class="s" data-a="f" data-id="'+i.id+'">Foto</button>':'')+'<button class="s" data-a="c" data-id="'+i.id+'">Código</button><button class="s" data-a="d" data-id="'+i.id+'">✕</button></div></div>'});
  $("list").innerHTML=h||'<div class="mu">Sin productos todavía.</div>';
}
function find(id){return S.items.filter(function(i){return i.id===id})[0]}
function byCode(c){c=c.trim().toLowerCase();return S.items.filter(function(i){return i.code.toLowerCase()===c})[0]}

$("addCat").onclick=function(){var v=$("newCat").value.trim();if(v&&S.cats.indexOf(v)<0){S.cats.push(v);$("newCat").value="";op({t:"cat",name:v});render()}};
$("chips").onclick=function(e){var c=e.target.closest(".chip");if(c){filter=c.dataset.c;render()}};
$("chips").oncontextmenu=function(e){var c=e.target.closest(".chip");if(c&&c.dataset.c){e.preventDefault();delCat(c.dataset.c)}};
var press;
$("chips").addEventListener("pointerdown",function(e){var c=e.target.closest(".chip");if(c&&c.dataset.c)press=setTimeout(function(){delCat(c.dataset.c)},700)});
["pointerup","pointerleave","pointermove"].forEach(function(t){$("chips").addEventListener(t,function(){clearTimeout(press)})});
function delCat(c){
  var n=S.items.filter(function(i){return i.cat===c}).length;
  if(n){alert("La categoría «"+c+"» tiene "+n+" producto(s). Muévelos o elimínalos primero.");return}
  S.cats=S.cats.filter(function(x){return x!==c});if(filter===c)filter="";op({t:"dcat",name:c});render();
}

$("add").onclick=function(){
  var name=$("fName").value.trim();if(!name||!$("fCat").value){return}
  var ph=pid($("fPhoto").value);if($("fPhoto").value.trim()&&!ph){alert("No reconocí el enlace de la foto. Pega el enlace de Drive (Compartir → Copiar enlace) o solo el ID.");return}
  var code=$("fCode").value.trim();
  if(!code){do{code="JM-"+String(S.seq++).padStart(4,"0")}while(byCode(code))}
  else if(byCode(code)){alert("Ese código ya existe.");return}
  S.items.unshift({id:Date.now()+""+Math.floor(Math.random()*999),code:code,name:name,cat:$("fCat").value,
    qty:+$("fQty").value||0,cost:+$("fCost").value||0,price:+$("fPrice").value||0,min:+$("fMin").value||0,photo:ph});
  ["fName","fQty","fCost","fPrice","fMin","fCode","fPhoto"].forEach(function(i){$(i).value=""});
  op({t:"add",item:S.items[0]});render();
};
$("list").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;var it=find(b.dataset.id);if(!it)return;
  var a=b.dataset.a;
  if(a==="c"){showCode(it);return}
  if(a==="f"){showPhoto(it);return}
  if(a==="p"){it.qty++;op({t:"mov",code:it.code,d:1})}
  else if(a==="m"&&it.qty>0){it.qty--;op({t:"mov",code:it.code,d:-1})}
  else if(a==="d"&&confirm("¿Eliminar «"+it.name+"»?")){S.items=S.items.filter(function(i){return i!==it});op({t:"del",code:it.code})}
  render();
};
$("q").oninput=render;

function move(d){
  var it=byCode($("scan").value);
  if(!it){$("scanMsg").textContent="No se encontró ese código.";return}
  if(it.qty+d<0)return;it.qty+=d;op({t:"mov",code:it.code,d:d});$("scanMsg").textContent=it.name+": "+it.qty+" en stock";
  $("scan").value="";render();
}
$("scan").onkeydown=function(e){if(e.key==="Enter"){var it=byCode($("scan").value);$("scanMsg").textContent=it?it.name+" · "+it.cat+" · "+it.qty+" en stock":"No se encontró ese código."}};
$("scanPlus").onclick=function(){move(1)};$("scanMinus").onclick=function(){move(-1)};

function showCode(it){
  $("dName").textContent=it.name;$("dCode").textContent=it.code;
  $("qr").innerHTML="";
  try{new QRCode($("qr"),{text:it.code,width:180,height:180})}catch(e){$("qr").textContent="No se pudo generar el QR."}
  try{JsBarcode("#bcSvg",it.code,{format:"CODE128",height:70,displayValue:true,margin:4})}catch(e){}
  tab("qr");$("dlg").showModal();
}
function tab(t){$("qr").hidden=t!=="qr";$("bc").hidden=t!=="bc";$("tQr").className="s"+(t==="qr"?" p":"");$("tBc").className="s"+(t==="bc"?" p":"")}
$("tQr").onclick=function(){tab("qr")};$("tBc").onclick=function(){tab("bc")};
$("cls").onclick=function(){$("dlg").close()};
$("prn").onclick=function(){try{window.print()}catch(e){}};

var PH={};
function pid(s){s=(s||"").trim();var m=s.match(/\/d\/([\w-]+)/)||s.match(/[?&]id=([\w-]+)/);if(m)return m[1];return /^[\w-]{20,}$/.test(s)?s:""}
function post(o){o.k=CFG.k;return fetch(CFG.u,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(o)}).then(function(r){return r.json()}).then(function(j){if(j.error)throw new Error(j.error);return j})}
async function loadPh(ids,prog){
  var need=ids.filter(function(x,n){return !PH[x]&&ids.indexOf(x)===n});
  for(var i=0;i<need.length;i+=4){var j=await post({act:"photos",ids:need.slice(i,i+4)});Object.assign(PH,j.photos);if(prog)prog(Math.min(i+4,need.length),need.length)}
}
async function showPhoto(it){
  $("pName").textContent=it.name+" · "+it.code;$("pImg").removeAttribute("src");$("pMsg").textContent="Cargando…";$("pdlg").showModal();
  try{await loadPh([it.photo]);if(PH[it.photo]){$("pImg").src=PH[it.photo];$("pMsg").textContent=""}else $("pMsg").textContent="No se encontró la foto."}catch(e){$("pMsg").textContent="No se pudo cargar ("+e.message+")"}
}
$("pCls").onclick=function(){$("pdlg").close()};
$("impBtn").onclick=async function(){
  if(!CFG.u||!CFG.k){$("impMsg").textContent="Conecta primero con Google Sheets.";return}
  $("impMsg").textContent="Importando… puede tardar.";
  try{await sync();var j=await post({act:"import"});$("impMsg").textContent=j.fotos+" fotos, "+j.nuevos+" productos nuevos";await sync()}catch(e){$("impMsg").textContent="Error: "+e.message}
};
$("cGen").onclick=async function(){
  var msg=$("cMsg");
  if(!window.jspdf){msg.textContent="No cargó la librería PDF (¿sin internet?).";return}
  if(!CFG.u||!CFG.k){msg.textContent="Conecta primero con Google Sheets.";return}
  var per=+$("cPer").value,cols=per===9?3:2,rows=per/cols,out=$("cOut").checked;
  var groups=S.cats.map(function(c){return{c:c,l:S.items.filter(function(i){return i.cat===c&&(out||i.qty>0)})}}).filter(function(g){return g.l.length});
  if(!groups.length){msg.textContent="No hay productos para el catálogo.";return}
  try{
    var ids=[];groups.forEach(function(g){g.l.forEach(function(i){if(i.photo)ids.push(i.photo)})});
    await loadPh(ids,function(a,b){msg.textContent="Descargando fotos "+a+"/"+b+"…"});
    msg.textContent="Armando PDF…";
    var d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),W=210,H=297,M=12,G=6,first=true,tot=0;
    var np=function(){if(first)first=false;else d.addPage()};
    var tit=$("cTit").value.trim();
    if(tit){np();d.setTextColor(30);d.setFont("helvetica","bold");d.setFontSize(34);d.text(tit,W/2,H/2-6,{align:"center"});d.setFont("helvetica","normal");d.setFontSize(12);d.text(new Date().toLocaleDateString("es-CO"),W/2,H/2+6,{align:"center"})}
    var cw=(W-2*M-G*(cols-1))/cols,ch=(H-2*M-G*(rows-1))/rows;
    groups.forEach(function(g){
      np();d.setTextColor(30);d.setFont("helvetica","bold");d.setFontSize(36);d.text(g.c.toUpperCase(),W/2,H/2,{align:"center"});d.addPage();
      g.l.forEach(function(it,n){
        var p=n%per;if(n>0&&p===0)d.addPage();
        var x=M+(p%cols)*(cw+G),y=M+Math.floor(p/cols)*(ch+G),bh=ch-9,src=PH[it.photo];tot++;
        d.setDrawColor(220);d.rect(x,y,cw,bh);
        if(src){try{var pr=d.getImageProperties(src),s=Math.min(cw/pr.width,bh/pr.height),w=pr.width*s,h=pr.height*s;d.addImage(src,pr.fileType,x+(cw-w)/2,y+(bh-h)/2,w,h)}catch(e){}}
        if(it.price){var t="$"+Math.round(it.price).toLocaleString("es-CO");d.setFont("helvetica","bold");d.setFontSize(11);var tw=d.getTextWidth(t)+6;d.setFillColor(184,134,11);d.rect(x+cw-tw,y,tw,7,"F");d.setTextColor(255);d.text(t,x+cw-tw+3,y+5)}
        d.setTextColor(30);d.setFont("helvetica","normal");d.setFontSize(10);d.text(it.code+(it.qty<=0?"  ·  AGOTADO":""),x,y+bh+5);
      });
    });
    d.save("catalogo.pdf");msg.textContent="Listo: "+tot+" productos.";
  }catch(e){msg.textContent="Error: "+e.message}
};
try{var raw=localStorage.getItem(KEY);if(raw)load(raw)}catch(e){}
$("cu").value=CFG.u;$("ck").value=CFG.k;render();status();sync();
setInterval(sync,60000);window.addEventListener("online",sync);
$("syncNow").onclick=sync;
$("cfgSave").onclick=function(){CFG.u=$("cu").value.trim();CFG.k=$("ck").value.trim();S.cats.forEach(function(c){Q.push({id:"c-"+c,t:"cat",name:c})});S.items.forEach(function(i){Q.push({id:"a-"+i.code,t:"add",item:i})});save();sync()};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
